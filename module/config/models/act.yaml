# ACT (Action Chunking with Transformers) 학습 설정

model_type: act

# 모델 하이퍼파라미터
chunk_size: 100           # 액션 청크 길이
n_obs_steps: 1            # 관측 히스토리 길이
hidden_dim: 512
dim_feedforward: 3200
n_heads: 8
n_encoder_layers: 4
n_decoder_layers: 7
dropout: 0.1

# 학습 설정
num_epochs: 100
batch_size: 32
lr: 1.0e-4
weight_decay: 1.0e-4
grad_clip: 10.0
lr_scheduler: cosine      # cosine | constant

# 데이터
num_workers: 4
use_amp: true             # AMP 혼합정밀도

# 체크포인트
save_every_epochs: 10
log_every_steps: 50

# 입력/출력 형상 (로봇에 맞게 수정)
input_shapes:
  observation.images.top:   [3, 480, 640]
  observation.images.wrist: [3, 480, 640]
  observation.state:        [14]          # Koch v1.1: 14-DoF
output_shapes:
  action:                   [14]
