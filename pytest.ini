[pytest]
markers =
    integration: requires real AmbRes model + GPU (run with: pytest -m integration)

# src/ 를 sys.path에 자동 추가 — test 파일에서 직접 import 가능
pythonpath = src

# 기본 실행 경로
testpaths = tests

# 로그 설정: 콘솔에는 WARNING 이상, 파일에는 INFO 이상 기록
log_cli = true
log_cli_level = WARNING
log_file = logs/pytest_latest.log
log_file_level = INFO
log_file_format = %(asctime)s  %(levelname)-8s  %(name)s — %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
